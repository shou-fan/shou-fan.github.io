<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王同睿 · 个人信息</title>
    <!-- 便于搜索引擎/审核爬虫识别 -->
    <meta name="description" content="王同睿（Wang Tongrui）的个人信息页 · 邮箱 wangtongrui@stu.scu.edu.cn">
    <meta name="author" content="王同睿 Wang Tongrui">

    <!-- 复用主页的 :root 变量、.navbar/.nav-clock/.nav-links/.page/.page-container 等所有通用样式 -->
    <link rel="stylesheet" href="../style.css">

    <style>
        /* /information 与主页完全一致的视觉/动效：
           - 顶部 .navbar 已经由 style.css 提供（磨砂玻璃 + 时钟 + 导航项）
           - 中间 .page-container > .page.active 就是「导航栏以下整片 78% 白 + blur(30) 磨砂」
           - 这里只加一个「加载后从右滑入」的入场动画（与主页 switchTo 时长/缓动一致） */
        html, body { overflow-x: hidden; }

        .info-page { animation: infoSlide 0.5s ease; }

        @keyframes infoSlide {
            from { transform: translateX(100%); }
            to   { transform: translateX(0); }
        }

        /* 卡片本身不再磨砂（page 已整片磨砂），只做信息排版容器 */
        .info-card {
            max-width: 560px;
            width: 100%;
        }
        .info-card h1 {
            font-size: 2.2rem;
            color: var(--text);
            margin: 0 0 0.2rem;
            letter-spacing: 0.05em;
        }
        .info-subtitle {
            color: var(--text-gray);
            font-size: 1rem;
            margin: 0 0 1.8rem;
            letter-spacing: 0.08em;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem 0;
        }
        .info-list li {
            display: flex;
            gap: 0.8rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 1rem;
            color: var(--text);
        }
        .info-list li:last-child { border-bottom: none; }
        .info-list .k { color: var(--text-gray); min-width: 4em; }
        .info-list .v { color: var(--text); word-break: break-all; }
        .info-list a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid #dddddd;
        }
        .info-list a:hover { color: var(--hover); border-bottom-color: var(--hover); }
        .info-back {
            display: inline-block;
            margin-top: 1rem;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        .info-back:hover { color: var(--hover); }
    </style>
</head>
<body>

    <!-- 与主页完全一致的顶部导航栏；除「个人」外都指回主站对应页面（hash 直达） -->
    <nav class="navbar">
        <div class="nav-clock" id="clock">--:--:--</div>
        <div class="nav-links">
            <a href="../#home">首页</a>
            <a href="../#research">科研</a>
            <a href="../#projects">项目</a>
            <a href="../#miniapp">小程序</a>
            <a href="./" class="nav-active">个人</a>
        </div>
    </nav>

    <!-- 与主页相同结构：page-container 之下就是整片磨砂的 .page -->
    <main class="page-container">
        <section class="page active info-page">
            <div class="info-card">
                <h1>王同睿</h1>
                <p class="info-subtitle">Wang Tongrui</p>

                <ul class="info-list">
                    <li><span class="k">姓名</span><span class="v">王同睿</span></li>
                    <li><span class="k">英文名</span><span class="v">Wang Tongrui</span></li>
                    <li><span class="k">邮箱</span><span class="v"><a href="mailto:wangtongrui@stu.scu.edu.cn">wangtongrui@stu.scu.edu.cn</a></span></li>
                </ul>

                <a href="../" class="info-back">← 返回个人主页</a>
            </div>
        </section>
    </main>

    <script>
        // ===== 与主页用同一组背景图，随机选一张挂到 body（相对本页在 ../indexback/） =====
        (function () {
            const images = [
                "12019-beach-1751455_1920.jpg",
                "cleverpix-pier-1467984_1920.jpg",
                "elija1703-beach-5982796_1920.jpg",
                "frankbeckerde-mountains-6540497_1920.jpg",
                "jwvein-autumn-7589934_1920.jpg",
                "stevepb-sunset-404072_1920.jpg",
                "yeskay1211-hills-2836301_1920.jpg",
            ];
            const pick = images[Math.floor(Math.random() * images.length)];
            document.body.style.backgroundImage = `url("../indexback/${pick}")`;
        })();

        // ===== 与主页同款：东七区 UTC+7 时钟 + 逐字符跳动 =====
        (function () {
            const clock = document.getElementById("clock");
            if (!clock) return;
            const pad = n => String(n).padStart(2, "0");
            let spans = [], prevChars = [];

            function buildSpans(text) {
                clock.innerHTML = "";
                spans = [];
                for (const ch of text) {
                    const s = document.createElement("span");
                    s.className = "clock-char";
                    s.textContent = ch;
                    clock.appendChild(s);
                    spans.push(s);
                }
            }

            function updateClock() {
                const now = new Date();
                const e7 = new Date(now.getTime() + 7 * 3600 * 1000);
                const date = `${e7.getUTCFullYear()}-${pad(e7.getUTCMonth() + 1)}-${pad(e7.getUTCDate())}`;
                const time = `${pad(e7.getUTCHours())}:${pad(e7.getUTCMinutes())}:${pad(e7.getUTCSeconds())}`;
                const text = `${date} ${time} UTC+7`;

                if (spans.length !== text.length) {
                    buildSpans(text);
                    prevChars = Array.from(text);
                    return;
                }
                for (let i = 0; i < text.length; i++) {
                    if (text[i] !== prevChars[i]) {
                        spans[i].textContent = text[i];
                        spans[i].classList.remove("tick");
                        void spans[i].offsetWidth;
                        spans[i].classList.add("tick");
                        prevChars[i] = text[i];
                    }
                }
            }

            updateClock();
            setInterval(updateClock, 1000);
        })();
    </script>
</body>
</html>
